spring.application.name=MS-Personas
server.port=0

#Multithreading
spring.threads.virtual.enabled=true

#Config BD
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.datasource.url=jdbc:mariadb://localhost:3310/personas
spring.datasource.username=root
spring.datasource.password=ey%2024#database
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# Kafka Properties
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.type.mapping=event:com.dev.java.MSPersonas.event.NewUserCreatedEvent
