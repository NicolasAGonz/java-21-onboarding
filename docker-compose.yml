version: '3.8'

services:
  node_app:
    build: ./otros/servicio/.
    ports:
      - "3000:3000" #HOST:Container

  #https://hub.docker.com/_/zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:latest #zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_RATE: 2000

  #https://hub.docker.com/r/apache/kafka
  broker:
    image: confluentinc/cp-kafka:latest #apache/kafka:latest
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    command: --default-authentication-plugin=ey%2024#database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ey%2024#database
      MYSQL_DATABASE: admin
      MYSQL_USER: eyuser
      MYSQL_PASSWORD: passwordey1234
    ports:
      - "3310:3306" #HOST:Container
    volumes:
      - ./volumenes/mariadb_data:/var/lib/mysql
      - ./volumenes/initDB.sql:/docker-entrypoint-initdb.d/1.sql  # Montar el directorio con los archivos SQL

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: eyuserroot
      MONGO_INITDB_ROOT_PASSWORD: passwordey1234
      MONGO_INITDB_DATABASE: root-db
    ports:
        - "27017:27017"
    volumes:
        - ./volumenes/mongodb_data:/data/db
        - ./docker-entrypoint-initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  mscuentas:
    build:
      context: ./MS-Cuentas
      dockerfile: Dockerfile
    image: mscuentas:latest
    container_name: mscuentas
    ports:
      - "8091:8091" #HOST:Container
    expose:
      - "8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - mariadb
      - broker
      - node_app

  mspersonas:
    build:
      context: ./MS-Personas
      dockerfile: Dockerfile
    image: mspersonas:latest
    container_name: mspersonas
    ports:
      - "8090:8090" #HOST:Container
    expose:
      - "8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - mariadb
      - broker
      - node_app

  mstarjetas:
    build:
      context: ./MS-Tarjetas
      dockerfile: Dockerfile
    image: mstarjetas:latest
    container_name: mstarjetas
    ports:
      - "8092:8092" #HOST:Container
    expose:
      - "8092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - mariadb
      - broker
      - node_app

volumes:
  mariadb_data:
  mongodb_data:
