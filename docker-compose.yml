version: '3.8'

services:
  node_app:
    build: ./otros/servicio/.
    ports:
      - "3000:3000" #HOST:Container

  #https://hub.docker.com/_/zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4 #zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  #https://hub.docker.com/r/apache/kafka
  broker:
    image: confluentinc/cp-kafka:7.4.4 #apache/kafka:latest
    container_name: broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENER_NAMES: INSIDE, OUTSIDE #INSIDE is for Docker containers, OUTSIDE is for localhost.
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INSIDE://broker:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mariadb:
    image: mariadb:latest
    container_name: mariadb
    command: --default-authentication-plugin=ey%2024#database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ey%2024#database
      MYSQL_DATABASE: admin
      MYSQL_USER: eyuser
      MYSQL_PASSWORD: passwordey1234
    ports:
      - "3310:3306" #HOST:Container
    volumes:
      - ./volumenes/mariadb_data:/var/lib/mysql
      - ./volumenes/initDB.sql:/docker-entrypoint-initdb.d/1.sql  # Montar el directorio con los archivos SQL

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: eyuserroot
      MONGO_INITDB_ROOT_PASSWORD: passwordey1234
      MONGO_INITDB_DATABASE: root-db
    ports:
        - "27017:27017"
    volumes:
        - ./volumenes/mongodb_data:/data/db
        - ./docker-entrypoint-initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  MS-Cuentas:
    build:
      context: ./MS-Cuentas
      dockerfile: Dockerfile
    image: ms-cuentas:latest
    container_name: MS-Cuentas
    ports:
      - "8091:8091" #HOST:Container
    expose:
      - "8091"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - mariadb
      - broker
      - node_app

  MS-Personas:
    build:
      context: ./MS-Personas
      dockerfile: Dockerfile
    image: ms-personas:latest
    container_name: MS-Personas
    ports:
      - "8090:8090" #HOST:Container
    expose:
      - "8090"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - mariadb
      - broker
      - node_app

  MS-Tarjetas:
    build:
      context: ./MS-Tarjetas
      dockerfile: Dockerfile
    image: ms-tarjetas:latest
    container_name: MS-Tarjetas
    ports:
      - "8092:8092" #HOST:Container
    expose:
      - "8092"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    depends_on:
      - mongodb
      - mariadb
      - broker
      - node_app

volumes:
  mariadb_data:
  mongodb_data:
